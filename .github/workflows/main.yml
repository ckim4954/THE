
name: Auto Detect, Repair and Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Auto Repair and Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      JAVA_VERSION: '17'
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # 1. Download source repository
      - name: Checkout Source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 2. Install Java
      - name: Install Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Detect source ZIP or existing Android project
      - name: Auto Detect and Extract Source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT=""

          echo "Searching for Android project..."

          if [ -f "$ROOT/settings.gradle.kts" ] || \
             [ -f "$ROOT/settings.gradle" ]; then
            PROJECT="$ROOT"
          else
            PROJECT=$(
              find "$ROOT" \
                -mindepth 2 -maxdepth 8 \
                -type f \
                \( -name settings.gradle.kts -o -name settings.gradle \) \
                -not -path '*/.git/*' \
                -not -path '*/_autobuild_source/*' \
                -printf '%d %h\n' |
              sort -n |
              head -n 1 |
              cut -d' ' -f2-
            )
          fi

          if [ -z "$PROJECT" ]; then

            ZIP=$(
              find "$ROOT" -type f -iname '*.zip' \
                -not -path '*/.git/*' \
                -not -path '*/_autobuild_source/*' \
                -printf '%T@ %p\n' |
              sort -nr |
              head -n 1 |
              cut -d' ' -f2-
            )

            if [ -z "$ZIP" ]; then
              echo "::error::No Android source ZIP found!"
              exit 1
            fi

            echo "Found ZIP: $ZIP"

            DEST="$ROOT/_autobuild_source"
            mkdir -p "$DEST"

            unzip -oq "$ZIP" -d "$DEST"

            SETTINGS=$(
              find "$DEST" -maxdepth 9 -type f \
                \( -name settings.gradle.kts -o -name settings.gradle \) |
              head -n 1
            )

            if [ -z "$SETTINGS" ]; then
              echo "::error::No Gradle project found inside ZIP!"
              exit 1
            fi

            PROJECT="$(dirname "$SETTINGS")"
          fi

          if [ ! -f "$PROJECT/gradlew" ]; then
            echo "::error::Missing Gradle Wrapper!"
            exit 1
          fi

          chmod +x "$PROJECT/gradlew"

          echo "Detected project: $PROJECT"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      # 4. Gradle cache
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # 5. Find existing Android SDK Manager
      - name: Prepare Android SDK Manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"

          echo "Checking Android SDK: $SDK"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found!"
            exit 1
          fi

          SDKMANAGER=$(
            find "$SDK/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null |
            sort -V |
            tail -n 1
          )

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in installed Android SDK!"
            exit 1
          fi

          chmod +x "$SDKMANAGER"

          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Found SDK Manager: $SDKMANAGER"

      # 6. Detect and install missing Android SDK components
      - name: Auto Install Missing Android SDK
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.sdkmanager }}
        run: |
          set -euo pipefail

          echo "Detecting compileSdk and buildToolsVersion..."

          read -r COMPILE_SDK BUILD_TOOLS NDK_VERSION < <(
            python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          compile_sdk = ""
          build_tools = ""
          ndk_version = ""

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix not in (".gradle", ".kts"):
                  continue

              if ".gradle" in path.parts or "build" in path.parts:
                  continue

              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue

              if not compile_sdk:
                  m = re.search(
                      r'\bcompileSdk(?:Version)?\s*(?:=\s*|\(\s*)?(\d+)',
                      text
                  )
                  if m:
                      compile_sdk = m.group(1)

              if not build_tools:
                  m = re.search(
                      r'buildToolsVersion\s*(?:=\s*)?["\']([^"\']+)',
                      text
                  )
                  if m:
                      build_tools = m.group(1)

              if not ndk_version:
                  m = re.search(
                      r'ndkVersion\s*(?:=\s*)?["\']([^"\']+)',
                      text
                  )
                  if m:
                      ndk_version = m.group(1)

          catalog = Path("gradle/libs.versions.toml")

          if catalog.exists() and not compile_sdk:
              try:
                  data = tomllib.loads(
                      catalog.read_text(encoding="utf-8")
                  )
                  versions = data.get("versions", {})

                  for key, value in versions.items():
                      if "compile" in key.lower() and "sdk" in key.lower():
                          compile_sdk = str(value)
                          break
              except Exception:
                  pass

          print(
              compile_sdk or "36",
              build_tools or "AUTO",
              ndk_version or "NONE"
          )
          PY
          )

          echo "compileSdk=$COMPILE_SDK"
          echo "buildTools=$BUILD_TOOLS"
          echo "NDK=$NDK_VERSION"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          # Install required platform and tools.
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}"

          # Install explicitly requested Build Tools.
          if [ "$BUILD_TOOLS" != "AUTO" ]; then
            "$SDKMANAGER" --install "build-tools;$BUILD_TOOLS"
          fi

          # Install NDK only if project requires it.
          if [ "$NDK_VERSION" != "NONE" ]; then
            "$SDKMANAGER" --install "ndk;$NDK_VERSION"
          fi

          echo "Android SDK preparation completed."

      # 7. Automatically repair KSP version catalog
      - name: Auto Repair KSP Configuration
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="gradle/libs.versions.toml"

          if [ ! -f "$FILE" ]; then
            echo "No version catalog. Skipping KSP catalog repair."
            exit 0
          fi

          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          path = Path("gradle/libs.versions.toml")
          content = path.read_text(encoding="utf-8")

          try:
              data = tomllib.loads(content)
          except Exception as e:
              print("Cannot parse version catalog:", e)
              raise SystemExit(0)

          plugins = data.get("plugins", {})
          versions = data.get("versions", {})

          version_key = None
          direct_version = None

          for name, plugin in plugins.items():
              if not isinstance(plugin, dict):
                  continue

              if plugin.get("id") != "com.google.devtools.ksp":
                  continue

              version = plugin.get("version", {})

              if isinstance(version, dict):
                  version_key = version.get("ref")
              elif isinstance(version, str):
                  direct_version = version

              break

          if version_key:
              current = str(versions.get(version_key, ""))

              if current.startswith("2.3.5"):
                  pattern = (
                      r'(?m)^(\s*' +
                      re.escape(version_key) +
                      r'\s*=\s*")[^"]+(")'
                  )

                  content, count = re.subn(
                      pattern,
                      r'\g<1>2.3.6\2',
                      content
                  )

                  if count:
                      path.write_text(content, encoding="utf-8")
                      print("KSP upgraded from 2.3.5 to 2.3.6")

          elif direct_version:
              if direct_version.startswith("2.3.5"):
                  print(
                      "KSP uses direct plugin version. "
                      "Please inspect manually before changing it."
                  )
              else:
                  print("KSP direct version:", direct_version)
          else:
              print("KSP plugin alias not detected. Skipping.")
          PY

      # 8. Verify Gradle environment
      - name: Verify Gradle Environment
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          java -version
          ./gradlew --version

      # 9. Build Android APK with automatic retry
      - name: Build Android Debug APK
        id: build
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -uo pipefail

          echo "Starting APK build..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

          RESULT=$?

          if [ "$RESULT" -ne 0 ]; then

            echo "::warning::First build failed. Retrying..."

            ./gradlew --stop || true

            rm -rf .gradle
            rm -rf app/build build

            ./gradlew \
              --no-daemon \
              --refresh-dependencies \
              --stacktrace \
              clean assembleDebug

            RESULT=$?
          fi

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Build failed after retry!"
            exit 1
          fi

          APK=$(
            find app/build/outputs/apk \
              -type f -name '*.apk' 2>/dev/null |
            head -n 1
          )

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::APK output not found!"
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

          echo "APK generated successfully:"
          ls -lh "$APK"

      # 10. Upload APK artifact
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: 89-Fitness-Yoga-Debug-APK
          path: ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # 11. Build summary
      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "## Android APK Build Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic source detection: Enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic ZIP extraction: Enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java: 17" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android SDK: Existing runner SDK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Missing SDK components: Auto install" >> "$GITHUB_STEP_SUMMARY"
          echo "- KSP catalog repair: Enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build retry: Enabled" >> "$GITHUB_STEP_SUMMARY"
