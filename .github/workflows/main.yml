
name: Build Android Debug APK (89 Fitness & Yoga V3)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3. Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"

          echo "Android SDK is available."

      - name: 4. Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: 5. Grant execute permission
        run: chmod +x ./gradlew

      - name: 6. Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          ./gradlew --version

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew

      - name: 7. Generate Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "$GITHUB_WORKSPACE/debug.keystore"

          echo "Debug keystore created."

      - name: 8. Clean and Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: 9. Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK_PATH"

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK_PATH"

      - name: 10. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 89-fitness-yoga-v3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
