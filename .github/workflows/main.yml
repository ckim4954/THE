
name: Build Android Debug APK (89 Fitness & Yoga V3)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      project_dir:
        description: "Tùy chọn: đường dẫn tương đối tới Android Project nếu repository có nhiều dự án"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17 (required by AGP 9.1.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          # Accept Android SDK licenses required by Gradle/AGP.
          # Disable pipefail only for this pipeline.
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: 5. Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: 6. Detect Android Project directory
        id: detect-project
        shell: bash
        env:
          PROJECT_DIR_INPUT: ${{ inputs.project_dir }}
        run: |
          set -euo pipefail

          WORKSPACE="$GITHUB_WORKSPACE"
          EXTRACT_ROOT="$RUNNER_TEMP/android-zip-sources"
          mkdir -p "$EXTRACT_ROOT"

          is_android_project() {
            local dir="$1"

            [[ -f "$dir/settings.gradle" || -f "$dir/settings.gradle.kts" ]] || return 1
            [[ -f "$dir/build.gradle" || -f "$dir/build.gradle.kts" ]] || return 1
            [[ -f "$dir/app/build.gradle" || -f "$dir/app/build.gradle.kts" ]] || return 1
            [[ -f "$dir/gradlew" ]] || return 1
            [[ -f "$dir/gradle/wrapper/gradle-wrapper.properties" ]] || return 1
            [[ -f "$dir/gradle/wrapper/gradle-wrapper.jar" ]] || return 1

            local settings_file
            settings_file="$(find "$dir" -maxdepth 1 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"

            grep -Eq 'include[[:space:]]*\([[:space:]]*["'\'']:?app["'\'']' "$settings_file" ||
              grep -Eq 'include[[:space:]]+["'\'']:?app["'\'']' "$settings_file"
          }

          find_projects() {
            local search_root="$1"

            python3 - "$search_root" <<'PY'
          import os
          import sys
          import re

          base = os.path.abspath(sys.argv[1])
          ignored = {".git", ".gradle", "build", "node_modules", ".idea"}
          found = []

          for current, dirs, files in os.walk(base):
              dirs[:] = [d for d in dirs if d not in ignored]

              settings = next(
                  (f for f in ("settings.gradle.kts", "settings.gradle") if f in files),
                  None
              )

              if not settings:
                  continue

              if not ({"build.gradle.kts", "build.gradle"} & set(files)):
                  continue

              app_dir = os.path.join(current, "app")

              if not os.path.isdir(app_dir):
                  continue

              if not (
                  os.path.isfile(os.path.join(app_dir, "build.gradle.kts"))
                  or os.path.isfile(os.path.join(app_dir, "build.gradle"))
              ):
                  continue

              settings_path = os.path.join(current, settings)

              try:
                  with open(settings_path, encoding="utf-8") as f:
                      content = f.read()
              except Exception:
                  continue

              if not re.search(r'include\s*\(?\s*["\']:?app["\']', content):
                  continue

              found.append(os.path.abspath(current))

          for item in sorted(set(found)):
              print(item)
          PY
          }

          candidates=()

          if [[ -n "${PROJECT_DIR_INPUT:-}" ]]; then
            requested_dir="$(realpath -m "$WORKSPACE/$PROJECT_DIR_INPUT")"

            case "$requested_dir" in
              "$WORKSPACE"/*) ;;
              *)
                echo "::error::project_dir phải nằm bên trong repository."
                exit 1
                ;;
            esac

            if ! is_android_project "$requested_dir"; then
              echo "::error::Đường dẫn project_dir không phải Android Project hợp lệ hoặc thiếu Gradle Wrapper/app module."
              exit 1
            fi

            candidates=("$requested_dir")
            echo "Đã sử dụng project_dir do người dùng chỉ định: $requested_dir"

          else
            mapfile -t candidates < <(find_projects "$WORKSPACE")

            if (( ${#candidates[@]} == 0 )); then
              echo "Không tìm thấy Android Project đã giải nén. Kiểm tra các file ZIP trong repository..."

              mapfile -d '' zip_files < <(
                find "$WORKSPACE" \
                  -type d \( -name .git -o -name .gradle -o -name build -o -name node_modules \) -prune \
                  -o -type f -iname '*.zip' -print0
              )

              if (( ${#zip_files[@]} == 0 )); then
                echo "::error::Không tìm thấy Android Project hoặc file ZIP chứa Android Project."
                exit 1
              fi

              python3 - "$EXTRACT_ROOT" "${zip_files[@]}" <<'PY'
          import os
          import sys
          import zipfile

          extract_root = os.path.abspath(sys.argv[1])
          os.makedirs(extract_root, exist_ok=True)

          for index, archive in enumerate(sys.argv[2:], start=1):
              destination = os.path.join(extract_root, f"archive-{index}")
              os.makedirs(destination, exist_ok=True)

              with zipfile.ZipFile(archive) as zf:
                  for member in zf.infolist():
                      target = os.path.abspath(
                          os.path.join(destination, member.filename)
                      )

                      if os.path.commonpath([destination, target]) != destination:
                          raise RuntimeError(
                              f"ZIP chứa đường dẫn không an toàn: {archive}"
                          )

                  zf.extractall(destination)

              print(f"Đã giải nén: {os.path.basename(archive)}")
          PY

              mapfile -t candidates < <(find_projects "$EXTRACT_ROOT")
            fi
          fi

          if (( ${#candidates[@]} == 0 )); then
            echo "::error::Không tìm thấy Android Project hợp lệ."
            exit 1
          fi

          if (( ${#candidates[@]} > 1 )); then
            echo "::error::Tìm thấy nhiều Android Project. Không tự chọn ngẫu nhiên. Hãy chạy workflow_dispatch và nhập project_dir."
            printf 'Project tìm thấy: %s\n' "${candidates[@]}"
            exit 1
          fi

          PROJECT_DIR="${candidates[0]}"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Đã xác định Android Project: $PROJECT_DIR"

      - name: 7. Verify toolchain and project wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Java ==="
          java -version

          echo "=== Gradle Wrapper configuration ==="
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

          echo "=== Project files ==="
          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradlew

          chmod +x ./gradlew

          ./gradlew --version

      - name: 8. Create the configured debug keystore if missing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$PWD/debug.keystore"

          if [[ ! -f "$KEYSTORE" ]]; then
            echo "debug.keystore không có trong source. Tạo keystore Debug theo đúng cấu hình signing."

            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storetype JKS \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Đã tìm thấy debug.keystore có sẵn. Giữ nguyên file hiện tại."
          fi

          test -s "$KEYSTORE"

      - name: 9. Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: 10. Verify and collect generated APK files
        shell: bash
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          APK_SOURCE_DIR="$PROJECT_DIR/app/build/outputs/apk"
          ARTIFACT_DIR="$RUNNER_TEMP/android-apk-artifacts"

          if [[ ! -d "$APK_SOURCE_DIR" ]]; then
            echo "::error::Không tìm thấy thư mục APK đầu ra: $APK_SOURCE_DIR"
            exit 1
          fi

          mapfile -d '' apk_files < <(
            find "$APK_SOURCE_DIR" -type f -name '*.apk' -print0
          )

          if (( ${#apk_files[@]} == 0 )); then
            echo "::error::Gradle kết thúc nhưng không tìm thấy file APK."
            exit 1
          fi

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          for apk in "${apk_files[@]}"; do
            relative_path="${apk#"$APK_SOURCE_DIR"/}"
            destination="$ARTIFACT_DIR/$relative_path"

            mkdir -p "$(dirname "$destination")"
            cp "$apk" "$destination"

            echo "APK: $destination"
            ls -lh "$destination"
          done

          echo "Đã xác minh ${#apk_files[@]} file APK."

      - name: 11. Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 89-fitness-yoga-v3-debug-apk
          path: ${{ runner.temp }}/android-apk-artifacts/
          if-no-files-found: error
          retention-days: 14
