name: Build Android Debug APK (89 Fitness & Yoga V4.0)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. Set up compatible JDK 21 (Required for AGP 9.x / Gradle 9.x)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: 5. Restore debug.keystore from debug.keystore.base64 if missing
        run: |
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          ls -lh app/src/main/res/drawable/

      - name: 6. Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: 7. Execute Gradle Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 8. Verify APK Output Exists
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK was not generated at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: 9. Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 89-fitness-yoga-v4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
