
name: Build Android Debug APK (89 Fitness & Yoga V3)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: 5. Grant execute permission
        run: chmod +x ./gradlew

      - name: 6. Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          ./gradlew --version

          echo "===== ANDROID SDK ====="
          test -d "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "===== PROJECT FILES ====="
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew

          echo "Build environment verified successfully."

      - name: 7. Generate Android Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$GITHUB_WORKSPACE/debug.keystore"

          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f "$KEYSTORE_PATH"
          echo "Debug keystore created successfully."

      - name: 8. Clean and Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: 9. Verify APK Output
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_PATH"

      - name: 10. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 89-fitness-yoga-v3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
