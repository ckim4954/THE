
name: Auto Repair and Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Detect, Repair and Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      JAVA_VERSION: '17'
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # 1. Download repository
      - name: Checkout Source
        uses: actions/checkout@v5

      # 2. Install Java
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Detect project or extract ZIP
      - name: Detect and Extract Source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT=""

          echo "Searching existing Android project..."

          PROJECT=$(find "$ROOT" \
            -mindepth 1 -maxdepth 8 \
            -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.git/*' \
            -not -path '*/_autobuild_source/*' \
            -printf '%d %h\n' |
            sort -n | head -n 1 | cut -d' ' -f2- || true)

          if [ -z "$PROJECT" ]; then

            echo "Searching ZIP source..."

            ZIP=$(find "$ROOT" -type f -iname '*.zip' \
              -not -path '*/.git/*' \
              -not -path '*/_autobuild_source/*' \
              -printf '%T@ %p\n' |
              sort -nr | head -n 1 | cut -d' ' -f2- || true)

            if [ -z "$ZIP" ]; then
              echo "::error::No Android project or source ZIP found!"
              exit 1
            fi

            echo "ZIP found: $ZIP"

            DEST="$ROOT/_autobuild_source"
            mkdir -p "$DEST"
            unzip -oq "$ZIP" -d "$DEST"

            SETTINGS=$(find "$DEST" -maxdepth 9 -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) |
              head -n 1 || true)

            if [ -z "$SETTINGS" ]; then
              echo "::error::No Gradle project found inside ZIP!"
              exit 1
            fi

            PROJECT=$(dirname "$SETTINGS")
          fi

          if [ ! -f "$PROJECT/gradlew" ]; then
            echo "::error::Gradle Wrapper missing!"
            exit 1
          fi

          echo "Project: $PROJECT"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      # 4. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. Locate SDK Manager WITHOUT chmod
      - name: Locate Android SDK Manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"

          echo "Android SDK: $SDK"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found!"
            exit 1
          fi

          SDKMANAGER=""

          # Prefer the SDK Manager already installed on runner.
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=$(command -v sdkmanager)
          else
            SDKMANAGER=$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null |
              sort -V | tail -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::SDK Manager not found!"
            exit 1
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::SDK Manager is not executable!"
            exit 1
          fi

          # IMPORTANT: Do not chmod preinstalled SDK files.
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

          echo "SDK Manager found: $SDKMANAGER"

      # 6. Install only required missing SDK packages
      - name: Install Missing SDK Components
        id: packages
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.sdkmanager }}
        run: |
          set -euo pipefail

          read -r COMPILE_SDK BUILD_TOOLS < <(
            python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          files = list(Path(".").rglob("build.gradle")) + \
                  list(Path(".").rglob("build.gradle.kts"))

          files = [
              p for p in files
              if ".gradle" not in p.parts and "build" not in p.parts
          ]

          compile_sdk = ""
          build_tools = ""

          for p in files:
              text = p.read_text(encoding="utf-8", errors="ignore")

              if not compile_sdk:
                  m = re.search(
                      r'\bcompileSdk(?:Version)?\s*(?:=\s*)?(\d+)',
                      text
                  )
                  if m:
                      compile_sdk = m.group(1)

              if not build_tools:
                  m = re.search(
                      r'buildToolsVersion\s*(?:=\s*)?["\']([^"\']+)',
                      text
                  )
                  if m:
                      build_tools = m.group(1)

          if not compile_sdk:
              catalog = Path("gradle/libs.versions.toml")
              if catalog.exists():
                  data = tomllib.loads(
                      catalog.read_text(encoding="utf-8")
                  )
                  for key, value in data.get("versions", {}).items():
                      if "compile" in key.lower() and "sdk" in key.lower():
                          compile_sdk = str(value)
                          break

          print(compile_sdk or "36", build_tools or "AUTO")
          PY
          )

          echo "Required compileSdk: $COMPILE_SDK"
          echo "Required build tools: $BUILD_TOOLS"

          # Accept licenses without changing SDK file permissions.
          set +e
          yes | "$SDKMANAGER" --licenses
          LICENSE_RESULT=$?
          set -e

          # Install the Android platform only if missing.
          if [ ! -d "$ANDROID_HOME/platforms/android-$COMPILE_SDK" ]; then
            "$SDKMANAGER" --install \
              "platforms;android-$COMPILE_SDK"
          else
            echo "Android platform already installed."
          fi

          # Install explicitly requested Build Tools only.
          if [ "$BUILD_TOOLS" != "AUTO" ]; then
            if [ ! -d "$ANDROID_HOME/build-tools/$BUILD_TOOLS" ]; then
              "$SDKMANAGER" --install \
                "build-tools;$BUILD_TOOLS"
            fi
          fi

          echo "SDK components ready."

      # 7. Repair KSP version catalog
      - name: Repair KSP Version
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="gradle/libs.versions.toml"

          if [ ! -f "$FILE" ]; then
            echo "No version catalog. Skipping."
            exit 0
          fi

          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          path = Path("gradle/libs.versions.toml")
          content = path.read_text(encoding="utf-8")

          data = tomllib.loads(content)

          plugins = data.get("plugins", {})
          versions = data.get("versions", {})

          for name, plugin in plugins.items():
              if not isinstance(plugin, dict):
                  continue

              if plugin.get("id") != "com.google.devtools.ksp":
                  continue

              version = plugin.get("version", {})

              if not isinstance(version, dict):
                  print("KSP has a direct version. No automatic change.")
                  break

              key = version.get("ref")

              if not key or key not in versions:
                  break

              current = str(versions[key])

              if current == "2.3.5":
                  pattern = (
                      r'(?m)^(\s*' +
                      re.escape(key) +
                      r'\s*=\s*")[^"]+(")'
                  )

                  content, count = re.subn(
                      pattern,
                      r'\g<1>2.3.6\2',
                      content
                  )

                  if count:
                      path.write_text(content, encoding="utf-8")
                      print("KSP upgraded to 2.3.6")
              else:
                  print("KSP version:", current)

              break
          else:
              print("KSP plugin not found. No change.")
          PY

      # 8. Verify environment
      - name: Verify Build Environment
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          java -version
          ./gradlew --version

      # 9. Build APK
      - name: Build Debug APK
        id: build
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -uo pipefail

          echo "Starting build..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

          RESULT=$?

          if [ "$RESULT" -ne 0 ]; then
            echo "::warning::Retrying build..."

            ./gradlew --stop || true

            rm -rf .gradle app/build build

            ./gradlew \
              --no-daemon \
              --refresh-dependencies \
              --stacktrace \
              clean assembleDebug

            RESULT=$?
          fi

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Build failed after retry."
            exit 1
          fi

          APK=$(find app/build/outputs/apk \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK not generated!"
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

      # 10. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 89-Fitness-Yoga-Debug-APK
          path: ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # 11. Summary
      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "## Android Build Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source ZIP detection: Enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java 17: Enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing Android SDK: Reused" >> "$GITHUB_STEP_SUMMARY"
          echo "- SDK permission modification: Disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- KSP repair: Conditional" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build retry: Enabled" >> "$GITHUB_STEP_SUMMARY"
