name: Auto Repair and Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Auto Detect, Repair and Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 2. Install Java
      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Detect source code or extract ZIP
      - name: Auto Detect and Extract Android Source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Android project..."

          PROJECT_DIR=""

          # First: Find an already extracted project.
          if [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ] || \
             [ -f "$GITHUB_WORKSPACE/settings.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            EXISTING_PROJECT=$(
              find "$GITHUB_WORKSPACE" \
                -mindepth 2 \
                -maxdepth 7 \
                -type f \
                \( -name settings.gradle.kts -o -name settings.gradle \) \
                -not -path '*/.git/*' \
                -not -path '*/_autobuild_source/*' \
                -printf '%d %h\n' |
              sort -n |
              head -n 1 |
              cut -d' ' -f2-
            )

            if [ -n "$EXISTING_PROJECT" ]; then
              PROJECT_DIR="$EXISTING_PROJECT"
            fi
          fi

          # Second: Find and extract the newest ZIP if necessary.
          if [ -z "$PROJECT_DIR" ]; then

            echo "No extracted project found. Searching ZIP files..."

            ZIP_FILE=$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname '*.zip' \
                -not -path '*/.git/*' \
                -not -path '*/_autobuild_source/*' \
                -printf '%T@ %p\n' |
              sort -nr |
              head -n 1 |
              cut -d' ' -f2-
            )

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No Android project or ZIP source found!"
              exit 1
            fi

            echo "Found source ZIP: $ZIP_FILE"

            EXTRACT_DIR="$GITHUB_WORKSPACE/_autobuild_source"

            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            echo "Searching extracted files..."

            SETTINGS_FILE=$(
              find "$EXTRACT_DIR" \
                -maxdepth 8 \
                -type f \
                \( -name settings.gradle.kts -o -name settings.gradle \) |
              head -n 1
            )

            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::ZIP does not contain a valid Gradle Android project!"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::Gradle Wrapper gradlew is missing!"
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 5. Install Gradle caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. Automatically repair configuration
      - name: Auto Repair Build Configuration
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project configuration..."

          chmod +x ./gradlew

          # Upgrade KSP in the version catalog.
          VERSION_FILE="gradle/libs.versions.toml"

          if [ -f "$VERSION_FILE" ]; then
            python3 - <<'PY'
          import re

          path = "gradle/libs.versions.toml"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          pattern = r'(?m)^(\s*googleDevtoolsKsp\s*=\s*")[^"]+(")'

          updated, count = re.subn(
              pattern,
              r'\g<1>2.3.12\2',
              content
          )

          if count:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(updated)

              print("KSP upgraded to 2.3.12")
          else:
              print("KSP version entry not found. Skipping automatic KSP patch.")
          PY
          fi

          # Generate debug signing key if missing.
          if [ ! -f "debug.keystore" ]; then
            echo "Generating missing debug.keystore..."

            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Configuration repair completed."

      # 7. Automatically install missing Android SDK components
      - name: Detect and Install Android SDK Components
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "::error::Android SDK Manager not found!"
            exit 1
          fi

          # Detect compileSdk.
          COMPILE_SDK=$(
            python3 - <<'PY'
          import re
          from pathlib import Path

          for file in Path(".").rglob("build.gradle.kts"):
              if ".gradle" in str(file):
                  continue

              text = file.read_text(encoding="utf-8")

              match = re.search(r'release\(\s*(\d+)', text)
              if not match:
                  match = re.search(r'compileSdk\s*=\s*(\d+)', text)

              if match:
                  print(match.group(1))
                  break
          PY
          )

          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK=36
          fi

          echo "Detected Android API: $COMPILE_SDK"

          # Accept Android SDK licenses.
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          # Install required Android components.
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;36.0.0"

          # Install NDK only if explicitly required.
          NDK_VERSION=$(
            grep -rhoE 'ndkVersion\s*=?\s*["'\''][0-9]+\.[0-9]+\.[0-9]+["'\'']' \
              --include='*.gradle' \
              --include='*.gradle.kts' . 2>/dev/null |
            head -n 1 |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true
          )

          if [ -n "$NDK_VERSION" ]; then
            echo "Installing NDK $NDK_VERSION"
            "$SDKMANAGER" --install "ndk;$NDK_VERSION"
          fi

          echo "Android SDK installation completed."

      # 8. Build APK
      - name: Build Android Debug APK
        id: build
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -uo pipefail

          echo "Starting Android build..."

          ./gradlew --version

          set +e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

          BUILD_RESULT=$?

          # Retry once with refreshed dependencies and clean caches.
          if [ "$BUILD_RESULT" -ne 0 ]; then

            echo "::warning::First build failed. Cleaning Gradle caches and retrying..."

            ./gradlew --stop || true

            rm -rf .gradle
            rm -rf app/build
            rm -rf build

            ./gradlew \
              --no-daemon \
              --refresh-dependencies \
              --stacktrace \
              clean assembleDebug

            BUILD_RESULT=$?
          fi

          set -e

          if [ "$BUILD_RESULT" -ne 0 ]; then
            echo "::error::Android build failed after retry."
            exit 1
          fi

          # Find generated APK.
          APK_FILE=$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' |
            head -n 1
          )

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::APK output not found!"
            exit 1
          fi

          APK_ABSOLUTE=$(realpath "$APK_FILE")

          echo "apk_path=$APK_ABSOLUTE" >> "$GITHUB_OUTPUT"

          echo "APK successfully generated:"
          ls -lh "$APK_ABSOLUTE"

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 89-Fitness-Yoga-Debug-APK
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # 10. Build summary
      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "## Android APK Build Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: Automatic ZIP/project detection" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java: JDK 17" >> "$GITHUB_STEP_SUMMARY"
          echo "- KSP: 2.3.12 (when version catalog is detected)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic retry: Enabled" >> "$GITHUB_STEP_SUMMARY"
