
name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Locate Android SDK
      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found!"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=$(command -v sdkmanager || true)

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager -print -quit)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found!"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK: $SDK"
          echo "SDK Manager: $SDKMANAGER"

      # 4. Accept licenses and install SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      # 5. Install Gradle
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 6. Automatically find ZIP source
      - name: Find and extract Android source
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r -d '' ZIP_FILE; do
            echo "Checking: $ZIP_FILE"

            EXTRACT_DIR=$(mktemp -d "$RUNNER_TEMP/android-XXXXXX")

            if ! unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"; then
              rm -rf "$EXTRACT_DIR"
              continue
            fi

            SETTINGS_FILE=$(find "$EXTRACT_DIR" \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit)

            if [ -n "$SETTINGS_FILE" ]; then
              CANDIDATE_DIR=$(dirname "$SETTINGS_FILE")

              if [ -f "$CANDIDATE_DIR/app/build.gradle.kts" ] || \
                 [ -f "$CANDIDATE_DIR/app/build.gradle" ]; then
                PROJECT_DIR="$CANDIDATE_DIR"
                echo "Project found: $PROJECT_DIR"
                break
              fi
            fi

            rm -rf "$EXTRACT_DIR"

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -not -path "*/.git/*" \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android source ZIP not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 7. Generate temporary debug keystore
      - name: Generate Debug Keystore
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storetype JKS \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 8. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace \
            :app:assembleDebug

      # 9. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated!"
            exit 1
          fi

          echo "BUILD SUCCESSFUL!"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 10. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 89-Fitness-Virtual-Member-Card-Debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
