
name: Build Android Debug APK (89 Fitness & Yoga V3)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      project_dir:
        description: "Android Project directory (để trống nếu tự nhận diện)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # IMPORTANT:
          # Do not install the deprecated "tools" package.
          packages: "platform-tools"

      - name: 4. Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: 5. Detect Android Project directory
        id: detect-project
        shell: bash
        env:
          PROJECT_DIR_INPUT: ${{ inputs.project_dir }}
        run: |
          set -euo pipefail

          WORKSPACE="$GITHUB_WORKSPACE"
          EXTRACT_ROOT="$RUNNER_TEMP/android-zip-sources"

          mkdir -p "$EXTRACT_ROOT"

          find_projects() {
            python3 - "$1" <<'PY'
          import os
          import sys
          import re

          base = os.path.abspath(sys.argv[1])
          ignored = {
              ".git", ".gradle", "build",
              "node_modules", ".idea"
          }

          found = []

          for current, dirs, files in os.walk(base):
              dirs[:] = [d for d in dirs if d not in ignored]

              settings = next(
                  (f for f in (
                      "settings.gradle.kts",
                      "settings.gradle"
                  ) if f in files),
                  None
              )

              if not settings:
                  continue

              if not (
                  {"build.gradle.kts", "build.gradle"}
                  & set(files)
              ):
                  continue

              app_dir = os.path.join(current, "app")

              if not os.path.isdir(app_dir):
                  continue

              if not (
                  os.path.isfile(os.path.join(
                      app_dir, "build.gradle.kts"
                  ))
                  or os.path.isfile(os.path.join(
                      app_dir, "build.gradle"
                  ))
              ):
                  continue

              if not os.path.isfile(
                  os.path.join(current, "gradlew")
              ):
                  continue

              if not os.path.isfile(
                  os.path.join(
                      current,
                      "gradle/wrapper/gradle-wrapper.properties"
                  )
              ):
                  continue

              if not os.path.isfile(
                  os.path.join(
                      current,
                      "gradle/wrapper/gradle-wrapper.jar"
                  )
              ):
                  continue

              settings_path = os.path.join(current, settings)

              with open(
                  settings_path, encoding="utf-8"
              ) as f:
                  content = f.read()

              if re.search(
                  r'include\s*\(?\s*["\']:?app["\']',
                  content
              ):
                  found.append(os.path.abspath(current))

          for project in sorted(set(found)):
              print(project)
          PY
          }

          if [[ -n "${PROJECT_DIR_INPUT:-}" ]]; then

            REQUESTED="$(realpath -m "$WORKSPACE/$PROJECT_DIR_INPUT")"

            case "$REQUESTED" in
              "$WORKSPACE"/*) ;;
              *)
                echo "::error::Project directory must be inside repository."
                exit 1
                ;;
            esac

            mapfile -t CANDIDATES < <(
              find_projects "$REQUESTED"
            )

            if [[ ! " ${CANDIDATES[*]} " =~ " $REQUESTED " ]]; then
              echo "::error::Selected directory is not a valid Android Project."
              exit 1
            fi

            CANDIDATES=("$REQUESTED")

          else

            mapfile -t CANDIDATES < <(
              find_projects "$WORKSPACE"
            )

            if (( ${#CANDIDATES[@]} == 0 )); then

              echo "No extracted Android Project found."
              echo "Searching ZIP archives..."

              mapfile -d '' ZIP_FILES < <(
                find "$WORKSPACE" \
                  -type d \( \
                    -name .git -o \
                    -name .gradle -o \
                    -name build -o \
                    -name node_modules \
                  \) -prune \
                  -o -type f -iname '*.zip' -print0
              )

              if (( ${#ZIP_FILES[@]} == 0 )); then
                echo "::error::No Android Project or source ZIP found."
                exit 1
              fi

              python3 - "$EXTRACT_ROOT" "${ZIP_FILES[@]}" <<'PY'
          import os
          import sys
          import zipfile

          root = os.path.abspath(sys.argv[1])
          os.makedirs(root, exist_ok=True)

          for index, archive in enumerate(
              sys.argv[2:], start=1
          ):
              destination = os.path.join(
                  root, f"archive-{index}"
              )

              os.makedirs(destination, exist_ok=True)

              with zipfile.ZipFile(archive) as zf:

                  for member in zf.infolist():
                      target = os.path.abspath(
                          os.path.join(
                              destination,
                              member.filename
                          )
                      )

                      if os.path.commonpath(
                          [destination, target]
                      ) != destination:
                          raise RuntimeError(
                              f"Unsafe ZIP path: {archive}"
                          )

                  zf.extractall(destination)

              print(
                  "Extracted:",
                  os.path.basename(archive)
              )
          PY

              mapfile -t CANDIDATES < <(
                find_projects "$EXTRACT_ROOT"
              )

            fi
          fi

          if (( ${#CANDIDATES[@]} == 0 )); then
            echo "::error::No valid Android Project detected."
            exit 1
          fi

          if (( ${#CANDIDATES[@]} > 1 )); then
            echo "::error::Multiple Android Projects detected. Select project_dir manually."
            printf '%s\n' "${CANDIDATES[@]}"
            exit 1
          fi

          PROJECT_DIR="${CANDIDATES[0]}"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=================================="
          echo "ANDROID PROJECT: $PROJECT_DIR"
          echo "=================================="

      - name: 6. Verify Java and Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== Java ==="
          java -version

          echo "=== Gradle Wrapper ==="
          grep '^distributionUrl=' \
            gradle/wrapper/gradle-wrapper.properties

          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradlew
          test -f app/build.gradle.kts

          chmod +x ./gradlew

          ./gradlew --version

      - name: 7. Create Debug Keystore if missing
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          KEYSTORE="$PWD/debug.keystore"

          if [[ ! -f "$KEYSTORE" ]]; then

            echo "Creating Android Debug Keystore..."

            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storetype JKS \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else

            echo "Existing Debug Keystore preserved."

          fi

          test -s "$KEYSTORE"

      - name: 8. Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: 9. Verify and collect APK files
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE_DIR="$PROJECT_DIR/app/build/outputs/apk"
          ARTIFACT_DIR="$RUNNER_TEMP/android-apk-artifacts"

          if [[ ! -d "$APK_SOURCE_DIR" ]]; then
            echo "::error::APK output directory not found."
            exit 1
          fi

          mapfile -d '' APK_FILES < <(
            find "$APK_SOURCE_DIR" \
              -type f -name '*.apk' -print0
          )

          if (( ${#APK_FILES[@]} == 0 )); then
            echo "::error::No APK files generated."
            exit 1
          fi

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          for APK in "${APK_FILES[@]}"; do

            RELATIVE_PATH="${APK#"$APK_SOURCE_DIR"/}"
            DESTINATION="$ARTIFACT_DIR/$RELATIVE_PATH"

            mkdir -p "$(dirname "$DESTINATION")"

            cp "$APK" "$DESTINATION"

            echo "Generated APK:"
            ls -lh "$DESTINATION"

          done

          echo "Total APK files: ${#APK_FILES[@]}"

      - name: 10. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 89-fitness-yoga-v3-debug-apk
          path: ${{ runner.temp }}/android-apk-artifacts/
          if-no-files-found: error
          retention-days: 14
